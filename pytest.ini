[pytest]
# Add the project root to sys.path so that 'rag' and 'backend' are importable.
pythonpath = .
# Discovery: only look inside the tests/ directory.
testpaths = tests
python_files = test_*.py
# -v  → verbose output (shows each test name and pass/fail)
# --tb=short → compact traceback on failures (easier to read)
addopts = -v --tb=short
